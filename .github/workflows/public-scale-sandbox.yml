name: Public scale sandbox gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controle-gastos-public-scale-sandbox
  cancel-in-progress: true

jobs:
  progressive-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BASE: https://60669cb6-48e8-4633-aaac-f95bf446bb48.sandbox.floot.app
      FLOOT_PREVIEW_TOKEN: ${{ secrets.FLOOT_PREVIEW_TOKEN }}
    steps:
      - name: Verify sandbox-only target and protected access
        shell: bash
        run: |
          node - <<'NODE'
          const u = new URL(process.env.TARGET_BASE);
          if (u.protocol !== 'https:' || !u.hostname.endsWith('.sandbox.floot.app')) {
            throw new Error(`Refusing non-sandbox load target: ${u.origin}`);
          }
          if (!process.env.FLOOT_PREVIEW_TOKEN) {
            throw new Error('Missing FLOOT_PREVIEW_TOKEN repository secret');
          }
          console.log(`Sandbox target accepted: ${u.origin}`);
          console.log('Protected preview access: configured');
          NODE

      - name: Progressive virtual-user simulation
        shell: bash
        run: |
          node - <<'NODE'
          import { writeFileSync, appendFileSync } from 'node:fs';

          const base = process.env.TARGET_BASE;
          const previewToken = process.env.FLOOT_PREVIEW_TOKEN;
          const target = new URL(base);

          if (target.protocol !== 'https:' || !target.hostname.endsWith('.sandbox.floot.app')) {
            throw new Error('Sandbox-only invariant failed');
          }
          if (!previewToken) {
            throw new Error('Protected preview token is required');
          }

          const routes = [
            { name: 'registration_policy', path: '/_api/auth/registration_policy', expected: 200 },
            { name: 'firebase_config', path: '/_api/auth/firebase_config', expected: 200 },
            { name: 'monetization_config', path: '/_api/monetization/config', expected: 200 },
            { name: 'session_unauth', path: '/_api/auth/session', expected: 401 },
            { name: 'history_unauth', path: '/_api/history/page?limit=30', expected: 401 },
          ];

          const stages = [
            { users: 100, concurrency: 50 },
            { users: 250, concurrency: 75 },
            { users: 500, concurrency: 100 },
            { users: 1000, concurrency: 150 },
            { users: 2000, concurrency: 200 },
          ];

          const timeoutMs = 12000;
          const percentile = (values, p) => {
            if (!values.length) return 0;
            const sorted = [...values].sort((a, b) => a - b);
            return sorted[Math.min(sorted.length - 1, Math.floor((sorted.length - 1) * p))];
          };

          async function oneRequest(index) {
            const route = routes[index % routes.length];
            const url = new URL(route.path, base);
            url.searchParams.set('ptoken', previewToken);
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            const started = performance.now();
            try {
              const response = await fetch(url, {
                method: 'GET',
                cache: 'no-store',
                signal: controller.signal,
                headers: {
                  accept: 'application/json,text/plain,*/*',
                  'user-agent': 'controle-gastos-public-ci/1.1',
                },
              });
              await response.arrayBuffer();
              return {
                route: route.name,
                status: response.status,
                expected: route.expected,
                ok: response.status === route.expected,
                ms: performance.now() - started,
              };
            } catch (error) {
              return {
                route: route.name,
                status: 0,
                expected: route.expected,
                ok: false,
                ms: performance.now() - started,
                error: error?.name || String(error),
              };
            } finally {
              clearTimeout(timer);
            }
          }

          async function runStage(stage) {
            const results = new Array(stage.users);
            let cursor = 0;
            async function worker() {
              for (;;) {
                const index = cursor++;
                if (index >= stage.users) return;
                results[index] = await oneRequest(index);
              }
            }

            const started = performance.now();
            await Promise.all(
              Array.from({ length: Math.min(stage.concurrency, stage.users) }, worker),
            );
            const elapsedMs = performance.now() - started;
            const latencies = results.map((r) => r.ms);
            const unexpected = results.filter((r) => !r.ok);
            const server5xx = results.filter((r) => r.status >= 500 && r.status <= 599);
            const networkErrors = results.filter((r) => r.status === 0);
            const statusCounts = {};
            const routeCounts = {};

            for (const r of results) {
              statusCounts[r.status] = (statusCounts[r.status] || 0) + 1;
              const key = `${r.route}:${r.status}`;
              routeCounts[key] = (routeCounts[key] || 0) + 1;
            }

            return {
              users: stage.users,
              concurrency: stage.concurrency,
              requests: results.length,
              elapsedMs: +elapsedMs.toFixed(1),
              throughputRps: +(results.length / (elapsedMs / 1000)).toFixed(1),
              p50: +percentile(latencies, 0.50).toFixed(1),
              p95: +percentile(latencies, 0.95).toFixed(1),
              p99: +percentile(latencies, 0.99).toFixed(1),
              max: +Math.max(...latencies).toFixed(1),
              unexpected: unexpected.length,
              server5xx: server5xx.length,
              networkErrors: networkErrors.length,
              statusCounts,
              routeCounts,
            };
          }

          const report = {
            generatedAt: new Date().toISOString(),
            target: target.origin,
            sandboxOnly: true,
            protectedAccess: true,
            stages: [],
          };

          let blocked = false;
          for (const stage of stages) {
            if (blocked) break;
            const result = await runStage(stage);
            report.stages.push(result);
            console.log(JSON.stringify(result));
            const unexpectedRate = result.unexpected / result.requests;
            if (result.server5xx > 0 || unexpectedRate > 0.01 || result.p95 > 8000) {
              blocked = true;
              report.stopReason = result.server5xx > 0
                ? 'server_5xx_detected'
                : unexpectedRate > 0.01
                  ? 'unexpected_response_rate_above_1pct'
                  : 'p95_above_8s';
              console.error(`Stopping ramp: ${report.stopReason}`);
            }
          }

          report.blocked = blocked;
          writeFileSync('public-scale-sandbox-result.json', JSON.stringify(report, null, 2));
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Controle de Gastos — sandbox load gate\n\n` +
              `Target: \`${target.origin}\` (sandbox only, protected access)\n\n` +
              report.stages
                .map((s) => `- ${s.users} VUs / conc ${s.concurrency}: p95 ${s.p95} ms, p99 ${s.p99} ms, ${s.throughputRps} req/s, unexpected ${s.unexpected}, 5xx ${s.server5xx}`)
                .join('\n') +
              `\n\nBlocked: **${blocked ? 'YES' : 'NO'}**${report.stopReason ? ` — ${report.stopReason}` : ''}\n`,
          );

          if (blocked) process.exitCode = 1;
          NODE

      - name: Upload load-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-scale-sandbox-result
          path: public-scale-sandbox-result.json
          if-no-files-found: warn
          retention-days: 7
